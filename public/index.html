<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat app</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js" defer></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/js/chat.js" defer></script>

</head>
<body>
    <h1>Chat app</h1>
    <div id="messages"></div>
    <form id="form">
        <label for="message">Send message</label><br>
        <input type="text" id="message" name="message"><br>
        <button>Send</button>
    </form>
    <button id="send-location">Send location</button>

    <script id="message-template" type="text/html">
        <div>
            <p>{{createdAt}} - {{message}}</p>
        </div>
    </script>
    <script id="url-template" type="text/html">
        <div>
            <p>{{createdAt}} - <a href="{{url}}" target="_blank">My current location</a></p>
        </div>
    </script>
</body>
</html>
